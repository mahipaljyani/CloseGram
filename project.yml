name: CloseGram
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "5"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  CloseGram:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: CloseGramLockMonitor
    entitlements:
      path: Sources/CloseGram.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.$(CLOSEGRAM_BUNDLE_ID)]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CloseGram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CloseGramAppGroup: group.$(CLOSEGRAM_BUNDLE_ID)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Used when you take a photo or video to post or send on Instagram.
        NSMicrophoneUsageDescription: Used when you record video or voice messages on Instagram.
        NSPhotoLibraryUsageDescription: Used when you pick photos or videos to post or send on Instagram.
        NSFaceIDUsageDescription: Used to unlock CloseGram when you turn on the Face ID lock.
        CFBundleURLTypes:
          - CFBundleURLName: closegram
            CFBundleURLSchemes: [closegram]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOSEGRAM_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(CLOSEGRAM_TEAM)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CloseGramLockMonitor:
    type: app-extension
    platform: iOS
    sources: [LockMonitor, Shared]
    info:
      path: LockMonitor/Info.plist
      properties:
        CFBundleDisplayName: CloseGram Lock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CloseGramAppGroup: group.$(CLOSEGRAM_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockMonitor
    entitlements:
      path: LockMonitor/LockMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.$(CLOSEGRAM_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOSEGRAM_BUNDLE_ID).lockmonitor
        DEVELOPMENT_TEAM: $(CLOSEGRAM_TEAM)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
